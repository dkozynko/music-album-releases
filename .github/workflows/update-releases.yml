name: Update album releases

on:
  schedule:
    - cron: '17 7 * * *'
      timezone: Europe/Warsaw
  workflow_dispatch:
    inputs:
      lastfm_only:
        description: Refresh Last.fm artist tags only
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-album-releases-main
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      TZ: Europe/Warsaw
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-browser.txt

      - name: Install browser dependencies
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chrome

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Restore public source responses
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: .cache/http
          key: post-rock-http-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: post-rock-http-v1-${{ runner.os }}-

      - name: Update current and previous years
        id: update
        timeout-minutes: 210
        env:
          LASTFM_ONLY: ${{ inputs.lastfm_only || false }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_ACCESS_TOKEN: ${{ secrets.REDDIT_ACCESS_TOKEN }}
        shell: bash
        run: |
          release_year="$(date +%Y)"
          update_log="$RUNNER_TEMP/release-update.log"
          update_args=(--year "$((release_year - 1))" "$release_year")
          if [[ "$LASTFM_ONLY" == 'true' ]]; then
            update_args+=(--lastfm-only)
          fi
          set +e
          python -u update.py "${update_args[@]}" 2>&1 | tee "$update_log"
          command_status=("${PIPESTATUS[@]}")
          set -e
          if (( command_status[1] != 0 )); then
            exit "${command_status[1]}"
          fi
          if (( command_status[0] != 0 )); then
            if (( command_status[0] != 1 )) ||
               grep -Eq '^Error:|^Traceback \(most recent call last\):' "$update_log" ||
               ! grep -q '^Warning:' "$update_log"; then
              exit "${command_status[0]}"
            fi
            echo '::warning::Some sources could not be refreshed; publishing successful updates and retaining previous data. See the job summary.'
          fi
          {
            echo '### Album release update'
            echo "Years: $((release_year - 1)), $release_year"
            echo '```text'
            grep -E '^[0-9]{4}:|^Warning:' "$update_log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save public source responses
        if: ${{ always() && steps.update.outcome != 'skipped' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: .cache/http
          key: post-rock-http-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit and push generated catalogs
        shell: bash
        run: |
          git add -- releases/post-rock/*.csv releases/post-rock/*.md releases/post-rock/excluded.json
          if git diff --cached --quiet; then
            echo 'No catalog changes to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: update post-rock releases ($(date +%F))"
          for push_attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if (( push_attempt < 3 )); then
              git pull --rebase origin main
            fi
          done
          exit 1
